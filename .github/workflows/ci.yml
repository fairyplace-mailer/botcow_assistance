name: build-and-test

on:
  push:
    branches:
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT_BOTCOW: dummy_ci_pat
      BOTCOW_DEFAULT_REPO: fairyplace-mailer/botcow_assistance
      OPENAI_API_KEY: dummy_ci_openai_key
      BLOB_READ_WRITE_TOKEN: dummy_ci_blob_token
      VERCEL_TOKEN: dummy_ci_vercel_token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build