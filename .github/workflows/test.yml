name: tests

on:
  push:
    branches:
      - provecta
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT_BOTCOW: ${{ secrets.BOTCOW_GITHUB_PAT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BOTCOW_DEFAULT_REPO: ${{ secrets.BOTCOW_DEFAULT_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Cost guard
        run: |
          set -euo pipefail

          if grep -R -n "@vercel/blob" src >/dev/null; then
            echo "Found @vercel/blob usage in src. Ensure Blob is required by spec." >&2
          else
            echo "No @vercel/blob usage in src. OK."
          fi

      - name: Test
        run: npm test
