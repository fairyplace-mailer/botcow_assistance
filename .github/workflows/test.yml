name: test

on:
  push:
    branches:
      - botcow-prevectus
  pull_request:
    branches:
      - botcow-prevectus
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (CI)
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    needs: [sanity]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  cost-guard:
    runs-on: ubuntu-latest
    needs: [sanity]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disallow @vercel/blob usage in src
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "@vercel/blob" src; then
            echo "ERROR: @vercel/blob usage is forbidden in src/ (cost control policy)."
            exit 1
          fi
          echo "OK: no @vercel/blob usage in src/"
