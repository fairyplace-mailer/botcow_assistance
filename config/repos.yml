# BotCow multi-repo configuration
#
# This file is the source of truth for which repositories BotCow may operate on,
# and how to map them to Vercel projects.
#
# Notes:
# - repo: GitHub repository in the form "owner/name"
# - defaultBranch: default branch used when not specified
# - vercel:
#   - projectId/teamId are Vercel identifiers (stored in env for the running app as needed)
#   - if you don't use a team, teamId can be omitted or left empty

version: 1

defaultRepo: fairyplace-mailer/botcow_assistance

repos:
  - repo: fairyplace-mailer/botcow_assistance
    defaultBranch: provecta
    vercel:
      projectIdEnv: VERCEL_PROJECT_ID_BOTCOW
      teamIdEnv: VERCEL_TEAM_ID

  - repo: fairyplace-mailer/botcat_chat
    defaultBranch: feature/ui
    vercel:
      projectIdEnv: VERCEL_PROJECT_ID_BOTCAT
      teamIdEnv: VERCEL_TEAM_ID

  - repo: fairyplace-mailer/botcat
    defaultBranch: dev
    vercel:
      projectIdEnv: VERCEL_PROJECT_ID_BOTCAT
      teamIdEnv: VERCEL_TEAM_ID
